<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Debug Compile</title>
<style>
html,body{margin:0;height:100%;background:#111;color:#ddd;font:12px/1.4 monospace}
#log{white-space:pre-wrap;padding:8px}
button{background:#2a2a2a;color:#ddd;border:1px solid #3a3a3a;padding:4px 10px;cursor:pointer;font:inherit;margin:2px}
button:hover{background:#3a3a3a}
#canvas{display:none}
</style>
</head>
<body>
<div style="padding:8px;display:flex;gap:8px;flex-wrap:wrap">
<button id="runAll">compile all shaders (timed)</button>
<button id="runSeq">compile first 5 in sequence (simulates startup)</button>
<button id="runVariants">compile every scene/shape variant of the first shader</button>
<label title="changes the GLSL source so the driver's source/binary cache cannot reuse this page's previous run"><input id="cacheBust" type="checkbox" checked> unique source (cold-cache probe)</label>
<button id="clear">clear</button>
<span id="status">idle</span>
</div>
<div id="log"></div>
<canvas id="c"></canvas>
<script src="js/glsl_lib.js"></script>
<script src="shaders/hollow_bubbles.js"></script>
<script src="shaders/thick_raymarch.js"></script>
<script src="shaders/thick_chain.js"></script>
<script src="shaders/XdXXzB.js"></script>
<script src="shaders/llsSDf.js"></script>
<script src="shaders/ld3SDl.js"></script>
<script src="shaders/multi_fresnel.js"></script>
<script src="shaders/multi_thinfilm.js"></script>
<script src="shaders/analytic_layers.js"></script>
<script src="shaders/thick_glass.js"></script>
<script src="shaders/thick_analytic.js"></script>
<script src="shaders/bench_fresnel.js"></script>
<script src="shaders/bench_thick.js"></script>
<script src="shaders/bench_hollow.js"></script>
<script src="shaders/bench_thinfilm.js"></script>
<script src="shaders/bench_chain.js"></script>
<script src="js/shaders.js"></script>
<script src="js/runner.js"></script>
<script>
const logEl = document.getElementById('log');
const statusEl = document.getElementById('status');
function log(s){ logEl.textContent += s + '\n'; console.log(s); }
function clearLog(){ logEl.textContent=''; }

const SHAPE = { sphere:0, cube:1, tetra:2, knot:3 };
let sourceNonce = 0;

// Build the exact source the runner sends to the driver for one variant. The
// optional nonce creates a genuinely new source key for repeatable cold-cache
// diagnosis; it is a preprocessor definition and cannot affect rendering.
function buildSource(meta, terrain, shape){
  const helpers = window.Runner.helpers;
  const flags = helpers.resolveChannelKinds(meta.source, meta.channels);
  const header = helpers.buildFSHeader(meta.source, flags) + helpers.buildUniformDecls(meta);
  return header + '#define USE_TERRAIN ' + terrain + '\n#define SHAPE_MODE ' + shape + '\n' +
    (sourceNonce ? '#define COMPILE_DEBUG_NONCE ' + sourceNonce + '\n' : '') +
    meta.source + helpers.FS_FOOTER;
}

// One variant, exactly like runner.js makeJob/advanceJob: with the extension it
// compiles+links on driver threads and is polled; without it the calls block.
// `steps` arrays report where the wall time actually went.
function compileVariant(gl, ext, meta, terrain, shape, cb){
  const src = buildSource(meta, terrain, shape);
  const t0 = performance.now();
  let vs = null, fs = null, prog = null;
  const st = { id: meta.id, key: terrain + ':' + shape, ok: true, err: '',
    srcLen: src.length, lines: src.split('\n').length,
    compileCall: 0, linkCall: 0, compileWait: 0, linkWait: 0,
    pollMax: 0, polls: 0, total: 0, async: !!ext };
  try {
    let t = performance.now();
    vs = gl.createShader(gl.VERTEX_SHADER);
    gl.shaderSource(vs, window.Runner.helpers.VS);
    gl.compileShader(vs);
    fs = gl.createShader(gl.FRAGMENT_SHADER);
    gl.shaderSource(fs, src);
    gl.compileShader(fs);
    st.compileCall = performance.now() - t;

    if (ext && typeof ext.COMPLETION_STATUS_KHR === 'number') {
      // async path — poll like the app does
      (function poll(){
        const t1 = performance.now();
        const vsDone = gl.getShaderParameter(vs, ext.COMPLETION_STATUS_KHR);
        const pollMs = performance.now() - t1;
        if (pollMs > st.pollMax) st.pollMax = pollMs;
        st.polls++;
        if (typeof vsDone !== 'boolean') { fail('driver rejected COMPLETION_STATUS_KHR (' + typeof vsDone + ')'); return; }
        if (!vsDone) return setTimeout(poll, 16);
        const fsDone = gl.getShaderParameter(fs, ext.COMPLETION_STATUS_KHR);
        if (typeof fsDone !== 'boolean') { fail('driver rejected COMPLETION_STATUS_KHR'); return; }
        if (!fsDone) return setTimeout(poll, 16);
        st.compileWait = performance.now() - t0;
        link();
      })();
    } else {
      // no extension — the status queries below block until done
      if (!gl.getShaderParameter(vs, gl.COMPILE_STATUS)) fail('VS: ' + gl.getShaderInfoLog(vs));
      else if (!gl.getShaderParameter(fs, gl.COMPILE_STATUS)) fail('FS: ' + gl.getShaderInfoLog(fs));
      else link();
    }

    function link(){
      if (st.err || !st.ok) return;
      const t = performance.now();
      const linkStarted = t;
      prog = gl.createProgram();
      gl.attachShader(prog, vs);
      gl.attachShader(prog, fs);
      gl.linkProgram(prog);
      st.linkCall = performance.now() - t;
      if (ext && typeof ext.COMPLETION_STATUS_KHR === 'number') {
        (function pollLink(){
          const t1 = performance.now();
          const done = gl.getProgramParameter(prog, ext.COMPLETION_STATUS_KHR);
          const pollMs = performance.now() - t1;
          if (pollMs > st.pollMax) st.pollMax = pollMs;
          st.polls++;
          if (typeof done !== 'boolean') { fail('link poll rejected COMPLETION_STATUS_KHR'); return; }
          if (!done) return setTimeout(pollLink, 16);
          st.linkWait = performance.now() - linkStarted;
          if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) fail('LINK: ' + gl.getProgramInfoLog(prog));
          else finish();
        })();
      } else {
        if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) fail('LINK: ' + gl.getProgramInfoLog(prog));
        else finish();
      }
    }

    function fail(msg){ st.ok = false; st.err = msg; finish(); }
    function finish(){
      st.total = performance.now() - t0;
      try { if (vs) gl.deleteShader(vs); } catch(e){}
      try { if (fs) gl.deleteShader(fs); } catch(e){}
      try { if (prog) gl.deleteProgram(prog); } catch(e){}
      cb(st);
    }
  } catch (e) {
    st.ok = false; st.err = 'exception: ' + e.message;
    st.total = performance.now() - t0;
    cb(st);
  }
}

function fmtRow(r){
  return '[' + r.id + ' t' + r.key + '] len=' + r.srcLen + ' lines=' + r.lines +
    ' total=' + (r.total|0) + 'ms' +
    ' compileCall=' + (r.compileCall|0) + 'ms' +
    ' linkCall=' + (r.linkCall|0) + 'ms' +
    (r.async ? ' compileWait=' + (r.compileWait|0) + 'ms linkWait=' + (r.linkWait|0) +
      'ms pollMax=' + r.pollMax.toFixed(1) + 'ms polls=' + r.polls : ' [SYNC]') +
    ' ok=' + r.ok +
    (r.err ? '  ERR: ' + r.err.slice(0,300) : '');
}

function ctxInfo(gl){
  const ext = gl.getExtension('KHR_parallel_shader_compile');
  log('GL vendor: ' + gl.getParameter(gl.VENDOR));
  log('GL renderer: ' + gl.getParameter(gl.RENDERER));
  log('GL version: ' + gl.getParameter(gl.VERSION));
  log('GLSL version: ' + gl.getParameter(gl.SHADING_LANGUAGE_VERSION));
  log('KHR_parallel_shader_compile: ' + (ext ? 'available' : 'unavailable (variant switches block!)'));
  if (ext) {
    log('  ext.COMPLETION_STATUS_KHR = ' + ext.COMPLETION_STATUS_KHR +
      (typeof gl.COMPLETION_STATUS_KHR === 'number'
        ? ' ; context exposes the same enum (0x' + gl.COMPLETION_STATUS_KHR.toString(16) + ')'
        : ' ; context does NOT expose gl.COMPLETION_STATUS_KHR (this was the INVALID_ENUM cause)'));
  }
  return ext;
}

function runList(list, label, cb){
  clearLog();
  sourceNonce = document.getElementById('cacheBust').checked ? ((Date.now() % 1000000000) | 0) : 0;
  const gl = document.getElementById('c').getContext('webgl2');
  if (!gl) { log('WebGL2 not supported'); return; }
  const ext = ctxInfo(gl);
  log('');
  log(label);
  const results = [];
  let i = 0;
  (function next(){
    if (i >= list.length) {
      statusEl.textContent = 'done';
      results.sort((a,b)=>b.total-a.total);
      log('\n--- slowest first ---');
      for (const r of results) log(r.id + ' t' + r.key + ': ' + (r.total|0) + 'ms' + (r.err ? ' FAILED' : ''));
      if (cb) cb(results);
      return;
    }
    const meta = list[i++];
    statusEl.textContent = 'compiling ' + meta.id + ' (' + i + '/' + list.length + ')';
    compileVariant(gl, ext, meta, 0, SHAPE.sphere, function(r){
      results.push(r);
      log(fmtRow(r));
      if (!r.ok && gl.isContextLost && gl.isContextLost()) { log('  WebGL context lost; stopping.'); statusEl.textContent='done'; return; }
      setTimeout(next, 16);
    });
  })();
}

function runAll(){
  const gl = document.getElementById('c').getContext('webgl2');
  if (!gl) { log('WebGL2 not supported'); return; }
  const ext = ctxInfo(gl);
  log('Found ' + (window.SHADERS||[]).length + ' shaders');
  const order = ['hollow_bubbles','thick_raymarch','thick_chain','analytic_layers','thick_glass','thick_analytic','multi_fresnel','multi_thinfilm','XdXXzB','llsSDf','ld3SDl'];
  const byId = {}; for (const s of (window.SHADERS||[])) byId[s.id] = s;
  runList(order.map(id=>byId[id]).filter(Boolean), 'Compiling every shader, terrain=0 shape=sphere (the default boot programs):');
}

function runSeq(){
  clearLog();
  const gl = document.getElementById('c').getContext('webgl2');
  if (!gl) { log('WebGL2 not supported'); return; }
  const ext = ctxInfo(gl);
  const order = ['hollow_bubbles','thick_raymarch','thick_chain','analytic_layers','thick_analytic','thick_glass','multi_fresnel','multi_thinfilm'];
  const byId = {}; for (const s of (window.SHADERS||[])) byId[s.id] = s;
  runList(order.map(id=>byId[id]).filter(Boolean), 'Compiling in startup order (simulates scene/shape clicks):');
}

// every compiled variant of the first scene shader — this is what background
// priming produces at boot and what a shape/terrain click has to compile
function runVariants(){
  clearLog();
  sourceNonce = document.getElementById('cacheBust').checked ? ((Date.now() % 1000000000) | 0) : 0;
  const gl = document.getElementById('c').getContext('webgl2');
  if (!gl) { log('WebGL2 not supported'); return; }
  const ext = ctxInfo(gl);
  const list = (window.SHADERS||[]).filter(s=>s.group==='scene');
  const meta = list[0];
  log('All variants of "' + meta.id + '" (terrain x shape):');
  const variants = [];
  for (let t = 0; t <= 1; t++) {
    for (let s = 0; s <= 3; s++) variants.push({ terrain: t, shape: s });
  }
  const results = [];
  let i = 0;
  (function next(){
    if (i >= variants.length) {
      statusEl.textContent = 'done';
      results.sort((a,b)=>b.total-a.total);
      log('\n--- slowest variant first ---');
      for (const r of results) log(r.id + ' t' + r.key + ': ' + (r.total|0) + 'ms' + (r.err ? ' FAILED' : ''));
      return;
    }
    const v = variants[i++];
    statusEl.textContent = 'compiling ' + meta.id + ' t' + v.terrain + ':' + v.shape + ' (' + i + '/' + variants.length + ')';
    compileVariant(gl, ext, meta, v.terrain, v.shape, function(r){
      results.push(r);
      log(fmtRow(r));
      setTimeout(next, 16);
    });
  })();
}

document.getElementById('runAll').addEventListener('click', runAll);
document.getElementById('runSeq').addEventListener('click', runSeq);
document.getElementById('runVariants').addEventListener('click', runVariants);
document.getElementById('clear').addEventListener('click', clearLog);

if (location.search.indexOf('auto')>=0) setTimeout(runAll, 500);
</script>
</body>
</html>
