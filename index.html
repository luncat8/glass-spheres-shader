<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shadertoy Runner</title>
<style>
	html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 13px/1.3 monospace; }
	#app { display: grid; grid-template-rows: auto 1fr auto auto; height: 100%; }
	#bar { display: flex; flex-direction: column; gap: 6px; padding: 8px; background: #1b1b1b; border-bottom: 1px solid #2a2a2a; }
	#bar .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
	#bar .row > strong { color: #888; min-width: 132px; }
	#bar .row > strong small { color: #5c5c5c; font-weight: normal; }
	#bar .group-tag { color: #5c5c5c; font-size: 11px; margin-left: 6px; }
	#bar .group-tag:first-child { margin-left: 0; }
	#bar #shader-buttons, #bar #scene-buttons, #bar #shape-buttons { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
	#bar #combo-note { display: none; color: #d9a441; font-size: 11px; }
	#bar button { background: #2a2a2a; color: #ddd; border: 1px solid #3a3a3a; padding: 4px 10px; cursor: pointer; font: inherit; }
	#bar button.active { background: #396; color: #000; }
	/* 'alt' = this combination does not exist; clicking it also moves the other selector */
	#bar button.alt { color: #7c7c7c; border-style: dashed; }
	#bar button.alt.active { color: #000; }
	#bar button:disabled { color: #4a4a4a; border-color: #2a2a2a; cursor: default; }
	#bar button:disabled:hover { background: #2a2a2a; }
	#bar button:hover { background: #3a3a3a; }
	#bar #cam { color: #9c9; }
	/* two ids beat `#bar button:disabled`, so the disabled cam needs its own rule */
	#bar #cam:disabled { color: #4a4a4a; }
	#bar #aa { color: #9c9; }
	#bar #music-wrap { display: inline-flex; align-items: center; gap: 5px; color: #999; cursor: pointer; }
	#bar #music-wrap.off { color: #555; cursor: default; }
	#bar #music-wrap input { accent-color: #396; cursor: pointer; }
	#bar #music-wrap.off input { cursor: default; }
	#bar a.stlink { color: #8cf; text-decoration: none; margin-left: 4px; font-size: 11px; border: 1px solid #2a4a6a; padding: 0 4px; border-radius: 2px; }
	#bar a.stlink:hover { background: #2a4a6a; color: #cef; }
	#bar span.shader-item { display: inline-flex; align-items: center; gap: 4px; }
	#meta a.stlink { color: #8cf; text-decoration: none; margin-left: 8px; font-size: 11px; border: 1px solid #2a4a6a; padding: 1px 5px; border-radius: 2px; }
	#meta a.stlink:hover { background: #2a4a6a; color: #cef; }
	#stage { position: relative; background: #000; overflow: hidden; }
	#c { display: block; width: 100%; height: 100%; image-rendering: auto; touch-action: none; user-select: none; -webkit-user-select: none; }
	#status { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 3px; }
	#params { display: none; flex-wrap: wrap; gap: 4px 0; align-items: stretch; padding: 6px 10px; background: #171717; border-top: 1px solid #2a2a2a; }
	#params .param-group { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; padding: 0 16px 0 0; margin: 0 0 0 12px; border-left: 1px solid #2c2c2c; }
	#params .param-group:first-child { margin-left: 0; border-left: none; }
	#params .param-group > b { color: #5a8a70; font-weight: normal; letter-spacing: 0.05em; text-transform: lowercase; }
	#params label.param { display: inline-flex; align-items: center; gap: 6px; color: #999; }
	#params label.param b { color: #6c9; min-width: 34px; text-align: right; font-weight: normal; }
	#params input[type=range] { width: 108px; accent-color: #396; }
	#params select { background: #2a2a2a; color: #ddd; border: 1px solid #3a3a3a; font: inherit; padding: 2px 4px; }
	#params .param-empty { color: #666; font-style: italic; }
	#info { padding: 6px 10px; background: #1b1b1b; border-top: 1px solid #2a2a2a; display: flex; gap: 16px; }
	#err { color: #f55; white-space: pre-wrap; max-height: 30vh; overflow: auto; }

	/* ---- benchmark panel ---- */
	#bench-panel { position: fixed; top: 44px; right: 8px; bottom: 8px; width: 400px; max-width: calc(100vw - 24px);
		background: #141414; border: 1px solid #2c2c2c; border-radius: 6px; padding: 8px 10px;
		z-index: 20; display: none; flex-direction: column; gap: 8px; overflow: auto; }
	#bench-panel.open { display: flex; }
	#bench-panel .bench-head { display: flex; align-items: center; justify-content: space-between; color: #9c9; }
	#bench-panel button { background: #2a2a2a; color: #ddd; border: 1px solid #3a3a3a; padding: 4px 8px; cursor: pointer; font: inherit; }
	#bench-panel button:disabled { opacity: 0.45; cursor: default; }
	#bench-panel .bench-settings { display: flex; align-items: center; gap: 5px; color: #999; flex-wrap: wrap; }
	#bench-panel select { background: #2a2a2a; color: #ddd; border: 1px solid #3a3a3a; font: inherit; padding: 2px 4px; }
	#bench-panel .bench-buttons { display: flex; gap: 8px; }
	#bench-panel .bench-preview { text-align: center; }
	#bench-panel canvas { max-width: 100%; max-height: 150px; background: #000; border: 1px solid #222; }
	#bench-panel .bench-note { color: #888; font-size: 11px; line-height: 1.35; }
	#bench-panel .bench-rows { display: flex; flex-direction: column; gap: 5px; }
	#bench-panel .bench-row { border: 1px solid #262626; border-radius: 4px; padding: 4px 6px; background: #191919; }
	#bench-panel .bench-row.current { border-color: #396; }
	#bench-panel .bench-row.winner { border-color: #a83; background: #201b12; }
	#bench-panel .bench-row.timeout { border-color: #633; }
	#bench-panel .bench-row.slow { border-color: #663; }
	#bench-panel .bench-name { color: #9c9; }
	#bench-panel .bench-src { color: #555; font-size: 11px; }
	#bench-panel .bench-metrics { color: #aaa; font-size: 12px; }
	#bench-panel .bench-summary { color: #888; font-size: 11px; white-space: pre-line; }
	#bar button#copy-prompt { background: #e8e8e8; color: #000; border-color: #9a9a9a; }
	#bar button#copy-prompt:hover { background: #fff; color: #000; }
</style>
</head>
<body>
<div id="app">
	<div id="bar">
		<div class="row">
			<strong title="how the objects are drawn: tracing / shading technique">shader <small>· how it draws - 💿 objects number - adjustable</small></strong>
			<span id="shader-buttons"></span>
		</div>
		<div class="row">
			<strong title="where drawn (interior, land, background) and how they move">scene <small>· where + motion</small></strong>
			<span id="scene-buttons"></span>
		</div>
		<div class="row">
			<strong title="what every object is; the knot needs a raymarched renderer">shape <small>· what it is</small></strong>
			<span id="shape-buttons"></span>
			<span id="combo-note"></span>
		</div>
		<div class="row">
		<span style="flex:1"></span>
		<button id="cam" title="camera auto-orbit for the scene-aware shaders (the ones that read the shared camera basis): 'auto' orbits until you move the camera (drag, wheel, pinch), then turns off; 'on' always orbits; 'off' never orbits. Dragging grabs the scene — it moves with the cursor, the same fraction of a turn at any window size. Shown as 'cam: n/a' for the shaders that orbit from iMouse inside their own GLSL">cam: auto</button>
		<button id="mov" title="sphere animation: 'on' advances the feed time that drives bubble motion; 'off' freezes the spheres in place (camera and visual effects keep moving)">mov: on</button>
		<button id="aa" title="SMAA 1x post-process antialiasing (auto-off above 2K)">aa: on</button>
		<label id="music-wrap" class="off" title="play the shader's procedural music"><input type="checkbox" id="music" disabled> music</label>
		<button id="bench" title="benchmark the multi-bubble shaders on the same 16-128 bubble scene at up to 4K; GPU ms is measured with EXT_disjoint_timer_query_webgl2 when available, otherwise via gl.finish(), so display refresh limits don't skew it">benchmark</button>
		<button id="copy-prompt" title="copy a prompt asking an LLM to implement a shader like the currently selected one (tech description + GitHub link)">copy prompt</button>
		<span id="fps" style="color:#888">-- fps</span>
		</div>
	</div>
	<div id="stage">
		<canvas id="c"></canvas>
		<div id="status">idle</div>
	</div>
	<div id="params"></div>
	<div id="info">
		<div id="meta" style="color:#888">no shader</div>
		<div id="err" style="flex:1"></div>
	</div>
</div>
	<script src="js/glsl_lib.js"></script>
	<script src="shaders/hollow_bubbles.js"></script>
	<script src="shaders/thick_raymarch.js"></script>
	<script src="shaders/thick_chain.js"></script>
	<script src="shaders/XdXXzB.js"></script>
	<script src="shaders/llsSDf.js"></script>
	<script src="shaders/ld3SDl.js"></script>
	<script src="shaders/multi_fresnel.js"></script>
	<script src="shaders/multi_thinfilm.js"></script>
	<script src="shaders/analytic_layers.js"></script>
	<script src="shaders/thick_glass.js"></script>
	<script src="shaders/thick_analytic.js"></script>
	<script src="shaders/bench_fresnel.js"></script>
	<script src="shaders/bench_thick.js"></script>
	<script src="shaders/bench_hollow.js"></script>
	<script src="shaders/bench_thinfilm.js"></script>
 	<script src="shaders/bench_chain.js"></script>
 	<script src="shaders/XdVSRV.js"></script>
	<script src="js/caps.js"></script>
	<script src="js/scenes.js"></script>
	<script src="js/shapes.js"></script>
	<script src="js/scene.js"></script>
	<script src="js/camera.js"></script>
	<script src="js/audio.js"></script>
	<script src="js/shaders.js"></script>
<script src="js/runner.js"></script>
<script src="js/smaa.js"></script>
<script src="js/prompts.js"></script>
<script src="js/bench.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
